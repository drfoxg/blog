name: ${COMPOSE_PROJECT_NAME:-blog-prod}

services:
  app:
    image: ghcr.io/drfoxg/blog:${IMAGE_TAG:-latest}
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    env_file:
      - .env
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: prod
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /tmp:/tmp
    networks:
      - app-blog-network
      - nginxproxyman
      - sqldev-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ghcr.io/drfoxg/blog:${IMAGE_TAG:-latest}
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app-blog-network
      - sqldev-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tgwsapiproxy:
    image: ghcr.io/drfoxg/tgwsapiproxy:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 3s
    command:
      [
        "tgwsapiproxy",
        "--worker-host",
        "${TGWS_WORKER_HOST}",
        "--listen-host",
        "${TGWS_LISTEN_HOST}",
        "--listen-port",
        "${TGWS_LISTEN_PORT}",
        "--http-port",
        "${TGWS_HTTP_PORT}",
      ]
    networks:
      - app-blog-network

  blog-webserver:
    image: ghcr.io/drfoxg/blog-nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    tty: true
    networks:
      - app-blog-network
      - nginxproxyman
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: "redis:alpine"
    restart: unless-stopped
    tty: true
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: >
      redis-server
      --bind 0.0.0.0
      --port 6973
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    ports:
      - 127.0.0.1:${REDIS_HOST_PORT:-6975}:6973
    volumes:
      - redis-blog:/var/lib/redis
    networks:
      - app-blog-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -p 6973 -a "$$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  app-blog-network:
    driver: bridge
  nginxproxyman:
    external: true
    name: nginxproxyman
  sqldev-backend:
    external: true
    name: sqldev-backend

volumes:
  redis-blog:
    driver: local
