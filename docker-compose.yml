name: ${COMPOSE_PROJECT_NAME:-blog}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: blog
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /tmp:/tmp
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - app-blog-network
      - nginxproxyman
      - sqldev-backend

  worker:
    image: blog
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - app-blog-network
      - sqldev-backend

  tgwsapiproxy:
    image: tgwsapiproxy:latest
    build:
      context: ./tgwsapiproxy
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 3s
    command:
      [
        "tgwsapiproxy",
        "--worker-host",
        "${TGWS_WORKER_HOST}",
        "--listen-host",
        "${TGWS_LISTEN_HOST}",
        "--listen-port",
        "${TGWS_LISTEN_PORT}",
        "--http-port",
        "${TGWS_HTTP_PORT}",
      ]
    networks:
      - app-blog-network

  blog-webserver:
    image: nginx:alpine
    restart: unless-stopped
    tty: true
    volumes:
      - ./:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets/:/etc/nginx/snippets/
    networks:
      - app-blog-network
      - nginxproxyman

  redis:
    image: "redis:alpine"
    restart: unless-stopped
    tty: true
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_REPLICATION_MODE=master
    ports:
      - 127.0.0.1:${REDIS_HOST_PORT:-6973}:6973
    volumes:
      - redis-blog:/var/lib/redis
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - app-blog-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -p 6973 -a "$$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  app-blog-network:
    driver: bridge
  nginxproxyman:
    external: true
    name: nginxproxyman
  sqldev-backend:
    external: true
    name: sqldev-backend

volumes:
  dbblog:
    driver: local
  redis-blog:
    driver: local
