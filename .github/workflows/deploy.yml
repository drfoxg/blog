name: Deploy

on:
  push:
    branches: [main, staging, production]

permissions:
  contents: read

jobs:
  deploy-dev:
    name: deploy-dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy to dev
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/lessons-blog/dev
            git pull --ff-only
            docker compose --env-file .env.compose.dev -f docker-compose.yml up -d
            docker compose --env-file .env.compose.dev -f docker-compose.yml exec -T app php artisan migrate --force
            docker compose --env-file .env.compose.dev -f docker-compose.yml exec -T app php artisan optimize
            docker compose --env-file .env.compose.dev -f docker-compose.yml exec -T app php artisan queue:restart
            curl -fsS https://blog-dev.sulfurfun.ru/up > /dev/null

  deploy-staging:
    name: deploy-staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/lessons-blog/staging
            git pull --ff-only
            docker compose --env-file .env.compose.staging -f docker-compose.yml up -d
            docker compose --env-file .env.compose.staging -f docker-compose.yml exec -T app php artisan migrate --force
            docker compose --env-file .env.compose.staging -f docker-compose.yml exec -T app php artisan optimize
            docker compose --env-file .env.compose.staging -f docker-compose.yml exec -T app php artisan queue:restart
            curl -fsS https://blog-staging.sulfurfun.ru/up > /dev/null

  deploy-prod:
    name: deploy-prod
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to prod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/lessons-blog/prod
            git pull --ff-only

            # login to GHCR using deploy token (if private packages)
            # echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin

            export IMAGE_TAG="sha-$(git rev-parse --short HEAD)"
            docker compose -f docker-compose.prod.yml --env-file .env.compose.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.compose.prod up -d

            docker compose -f docker-compose.prod.yml --env-file .env.compose.prod exec -T app \
              php artisan migrate --force --database=mysql_migrator
            docker compose -f docker-compose.prod.yml --env-file .env.compose.prod exec -T app \
              php artisan optimize
            docker compose -f docker-compose.prod.yml --env-file .env.compose.prod exec -T app \
              php artisan queue:restart

            curl -fsS https://blog.sulfurfun.ru/up > /dev/null
