name: Deploy

on:
  push:
    branches: [main, staging, production]

permissions:
  contents: read

jobs:
  deploy-dev:
    name: deploy-dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy to dev
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/lessons-blog/dev
            git pull --ff-only
            docker compose --env-file .env.compose.dev --env-file .env -f docker-compose.yml down
            docker compose --env-file .env.compose.dev --env-file .env -f docker-compose.yml up -d
            docker compose --env-file .env.compose.dev --env-file .env -f docker-compose.yml exec -T app php artisan migrate --force
            docker compose --env-file .env.compose.dev --env-file .env -f docker-compose.yml exec -T app php artisan optimize
            docker compose --env-file .env.compose.dev --env-file .env -f docker-compose.yml exec -T app php artisan queue:restart
            curl -fsS https://blog-dev.sulfurfun.ru/up > /dev/null

  deploy-staging:
    name: deploy-staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/lessons-blog/staging
            git pull --ff-only
            docker compose --env-file .env.compose.staging --env-file .env -f docker-compose.yml down
            docker compose --env-file .env.compose.staging --env-file .env -f docker-compose.yml up -d
            docker compose --env-file .env.compose.staging --env-file .env -f docker-compose.yml exec -T app php artisan migrate --force
            docker compose --env-file .env.compose.staging --env-file .env -f docker-compose.yml exec -T app php artisan optimize
            docker compose --env-file .env.compose.staging --env-file .env -f docker-compose.yml exec -T app php artisan queue:restart
            curl -fsS https://blog-staging.sulfurfun.ru/up > /dev/null
