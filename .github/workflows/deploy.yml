name: Deploy

on:
  push:
    branches: [main, staging, production]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag for production (empty = current version)"
        required: false
        type: string
        default: ""
permissions:
  contents: read

jobs:
  deploy-dev:
    name: deploy-dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # DEV: собирается локально на сервере (docker compose build), код монтируется
      # через bind mount. GHCR-образы для dev НЕ используются.
      - name: Deploy to dev
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/lessons-blog/dev
            git pull --ff-only
            docker compose --env-file .env.compose.dev --env-file .env -f docker-compose.yml down
            docker compose --env-file .env.compose.dev --env-file .env -f docker-compose.yml build
            docker compose --env-file .env.compose.dev --env-file .env -f docker-compose.yml up -d
            docker compose --env-file .env.compose.dev --env-file .env -f docker-compose.yml exec -T app php artisan migrate --force
            docker compose --env-file .env.compose.dev --env-file .env -f docker-compose.yml exec -T app php artisan optimize
            docker compose --env-file .env.compose.dev --env-file .env -f docker-compose.yml exec -T app php artisan queue:restart
            curl -fsS https://blog-dev.sulfurfun.ru/up > /dev/null

  # STAGING: собирается локально на сервере (docker compose build), код монтируется
  # через bind mount. GHCR-образы для staging НЕ используются.
  deploy-staging:
    name: deploy-staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/lessons-blog/staging
            git pull --ff-only
            docker compose --env-file .env.compose.staging --env-file .env -f docker-compose.staging.yml down
            docker compose --env-file .env.compose.staging --env-file .env -f docker-compose.staging.yml build
            docker compose --env-file .env.compose.staging --env-file .env -f docker-compose.staging.yml up -d
            docker compose --env-file .env.compose.staging --env-file .env -f docker-compose.staging.yml exec -T app php artisan migrate --force
            docker compose --env-file .env.compose.staging --env-file .env -f docker-compose.staging.yml exec -T app php artisan optimize
            docker compose --env-file .env.compose.staging --env-file .env -f docker-compose.staging.yml exec -T app php artisan queue:restart
            curl -fsS https://blog-staging.sulfurfun.ru/up > /dev/null

  # PROD: использует immutable-образы из GHCR (docker compose pull).
  # Код НЕ монтируется, .env генерируется из Secrets.
  deploy-prod:
    name: deploy-prod
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Deploy to prod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd ~/lessons-blog/prod
            git pull --ff-only

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u drfoxg --password-stdin

            cat > .env <<EOF
            APP_NAME=Laravel
            APP_ENV=production
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=https://blog.sulfurfun.ru

            LOG_CHANNEL=stderr
            LOG_LEVEL=warning

            DB_CONNECTION=mysql
            DB_HOST=mysql-dev
            DB_PORT=3306
            DB_DATABASE=blog_prod
            DB_USERNAME=blog_prod_user
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            DB_MIGRATOR_USERNAME=blog_prod_migrator
            DB_MIGRATOR_PASSWORD=${{ secrets.DB_MIGRATOR_PASSWORD }}

            CACHE_STORE=redis
            QUEUE_CONNECTION=redis
            SESSION_DRIVER=database

            REDIS_HOST=redis
            REDIS_PORT=6973
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            TELEGRAM_PROXY_URL=http://tgwsapiproxy:8080

            TGWS_WORKER_HOST=${{ secrets.TGWS_WORKER_HOST }}
            TGWS_LISTEN_HOST=0.0.0.0
            TGWS_LISTEN_PORT=1080
            TGWS_HTTP_PORT=8080
            EOF

            chmod 600 .env
            set -a; source .env; set +a

            if [[ -n "${IMAGE_TAG:-}" ]]; then
              # Ручное указание тега (например, rollback)
              if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{7}$ ]]; then
                echo "ERROR: Invalid IMAGE_TAG: $IMAGE_TAG"
                exit 1
              fi
            else
              # Обычный deploy: определяем тег автоматически
              if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
                IMAGE_SOURCE_SHA=$(git rev-parse HEAD^2)
              else
                IMAGE_SOURCE_SHA=$(git rev-parse HEAD)
              fi

              IMAGE_TAG="sha-$(git rev-parse --short=7 "$IMAGE_SOURCE_SHA")"
            fi

            export IMAGE_TAG
            echo "▶ Deploying image tag: $IMAGE_TAG"

            # Проверяем наличие всех production-образов в GHCR
            IMAGES=(
              "ghcr.io/drfoxg/blog:${IMAGE_TAG}"
              "ghcr.io/drfoxg/blog-nginx:${IMAGE_TAG}"
              "ghcr.io/drfoxg/tgwsapiproxy:${IMAGE_TAG}"
            )

            for image in "${IMAGES[@]}"; do
              echo "▶ Checking image: $image"

              if ! docker manifest inspect "$image" > /dev/null 2>&1; then
                echo "ERROR: Image not found or inaccessible: $image"
                exit 1
              fi
            done

            echo "✓ All production images are available"

            docker compose -f docker-compose.prod.yml --env-file .env.compose.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.compose.prod up -d

            docker compose -f docker-compose.prod.yml --env-file .env.compose.prod exec -T app \
              php artisan migrate --force --database=mysql_migrator
            docker compose -f docker-compose.prod.yml --env-file .env.compose.prod exec -T app \
              php artisan optimize:clear
            docker compose -f docker-compose.prod.yml --env-file .env.compose.prod exec -T app \
              php artisan optimize

            for i in 1 2 3 4 5; do
              docker compose -f docker-compose.prod.yml --env-file .env.compose.prod exec -T app \
                php artisan queue:restart && break
              echo "queue:restart retry $i..."; sleep 3
            done

            # Health check
            curl -fsS https://blog.sulfurfun.ru/up > /dev/null

            # Record successful production deployment
            DEPLOY_LOG="$HOME/lessons-blog/production-deploys.log"

            DEPLOYED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
            DEPLOY_COMMIT=$(git rev-parse HEAD)

            printf '%s\t%s\t%s\n' \
              "$DEPLOYED_AT" \
              "$IMAGE_TAG" \
              "$DEPLOY_COMMIT" >> "$DEPLOY_LOG"

            echo "✓ Deployment recorded: $IMAGE_TAG"
