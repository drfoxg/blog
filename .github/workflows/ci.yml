name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/drfoxg

jobs:
  # 1. Detector: определяет, есть ли в PR изменения кода (не только docs)
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 'every' критичен: 'code' = true, если ВСЕ изменённые файлы не docs
          predicate-quantifier: "every"
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  lint-workflows:
    name: lint-workflows
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint .github/workflows/*.yml

      - name: Prepare .env for make dry-run
        run: cp .env.example .env

      - name: Validate Makefile
        run: make validate-makefile

  test:
    name: test
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, zip, exif, pcntl, gd, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare .env for tests
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Run php-cs-fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Validate compose (dev)
        run: docker compose --env-file .env.compose.dev -f docker-compose.yml config -q
        env:
          REDIS_PASSWORD: test
          TGWS_WORKER_HOST: test
          TGWS_LISTEN_HOST: test
          TGWS_LISTEN_PORT: test
          TGWS_HTTP_PORT: test

      - name: Validate compose (staging)
        run: docker compose --env-file .env.compose.staging -f docker-compose.staging.yml config -q
        env:
          REDIS_PASSWORD: test
          TGWS_WORKER_HOST: test
          TGWS_LISTEN_HOST: test
          TGWS_LISTEN_PORT: test
          TGWS_HTTP_PORT: test

      - name: Validate compose (prod)
        run: docker compose --env-file .env.compose.prod -f docker-compose.prod.yml config -q
        env:
          REDIS_PASSWORD: test
          TGWS_WORKER_HOST: test
          TGWS_LISTEN_HOST: test
          TGWS_LISTEN_PORT: test
          TGWS_HTTP_PORT: test

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [detect, test]
    if: github.event_name == 'push' && needs.detect.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: blog
            dockerfile: Dockerfile.prod
            context: .
          - name: blog-nginx
            dockerfile: Dockerfile.nginx
            context: .
          - name: tgwsapiproxy
            dockerfile: tgwsapiproxy/Dockerfile
            context: ./tgwsapiproxy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short sha
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:sha-${{ steps.vars.outputs.short }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # 2. Gate: всегда запускается, агрегирует результаты, требуется в Ruleset
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [detect, lint-workflows, test]
    if: always()
    steps:
      - name: Check results
        run: |
          # detect всегда должен быть success
          if [[ "${{ needs.detect.result }}" != "success" ]]; then
            echo "detect failed or skipped"
            exit 1
          fi
          # если это code-PR, lint-workflows и test должны быть success
          if [[ "${{ needs.detect.outputs.code }}" == "true" ]]; then
            if [[ "${{ needs.lint-workflows.result }}" != "success" ]]; then
              echo "lint-workflows not successful"
              exit 1
            fi
            if [[ "${{ needs.test.result }}" != "success" ]]; then
              echo "test not successful"
              exit 1
            fi
          else
            echo "docs-only PR — heavy jobs skipped, gate passes"
          fi
          echo "gate passed"
