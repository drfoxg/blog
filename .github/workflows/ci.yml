name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/drfoxg

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, zip, exif, pcntl, gd, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare .env for tests
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Run php-cs-fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Validate compose (dev)
        run: docker compose --env-file .env.compose.dev -f docker-compose.yml config -q
        env:
          REDIS_PASSWORD: test
          TGWS_WORKER_HOST: test
          TGWS_LISTEN_HOST: test
          TGWS_LISTEN_PORT: test
          TGWS_HTTP_PORT: test

      - name: Validate compose (prod)
        run: docker compose --env-file .env.compose.prod -f docker-compose.prod.yml config -q
        env:
          REDIS_PASSWORD: test
          TGWS_WORKER_HOST: test
          TGWS_LISTEN_HOST: test
          TGWS_LISTEN_PORT: test
          TGWS_HTTP_PORT: test

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: blog
            dockerfile: Dockerfile.prod
            context: .
          - name: blog-nginx
            dockerfile: Dockerfile.nginx
            context: .
          - name: tgwsapiproxy
            dockerfile: tgwsapiproxy/Dockerfile
            context: ./tgwsapiproxy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short sha
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:sha-${{ steps.vars.outputs.short }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
